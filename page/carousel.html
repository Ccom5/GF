        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, rgba(211, 186, 145, 0.34) 0%, rgba(157, 128, 80, 0.25) 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .page-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 30px;
                width: 100%;
                max-width: 450px;
            }

            .carousel-title {
                color: #302410;
                font-size: 2.5rem;
                font-weight: 400;
                text-align: center;
                text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.59);
                margin: 0;
                letter-spacing: 1px;
            }

            .carousel-container {
                width: 100%;
                position: relative;
                background: #ddc3a4;
                border-radius: 10px;
                box-shadow: 0 10px 40px rgba(28, 26, 26, 0.53);
                overflow: hidden;
            }

            .carousel {
                position: relative;
                width: 100%;
                height: 600px;
                overflow: hidden;
            }

            .carousel-track {
                display: flex;
                transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
                height: 100%;
            }

            .carousel-slide {
                min-width: 100%;
                height: 100%;
                position: relative;
                background-size: contain;
                background-position: center;
                background-repeat: no-repeat;
                background-color: #c4c4c4;
                display: flex;
                align-items: flex-end;
                justify-content: center;
            }

            .slide-content {
                text-align: center;
                color: #f1f1f1;
                background: rgba(0, 0, 0, 0.7);
                padding: 20px 30px;
                border-radius: 15px;
                backdrop-filter: blur(10px);
                margin: 10px;
                max-width: 90%;
            }

            .slide-content h2 {
                font-size: 2.5rem;
                margin-bottom: 10px;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            }

            .slide-content p {
                font-size: 1rem;
                opacity: 0.9;
            }

            .carousel-controls {
                position: absolute;
                top: 90%;
                transform: translateY(-50%);
                background: rgba(255, 255, 255, 0.44);
                border: none;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                transition: all 0.3s ease;
                z-index: 10;
            }

            .carousel-controls:hover {
                background: #804e4e;
                transform: translateY(-60%) scale(1);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.72);
            }

            .prev {
                left: 1px;
            }

            .next {
                right: 1px;
            }

            .control-panel {
                background: #ab9a7f;
                padding: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 20px;
            }

            .dots-container {
                display: flex;
                gap: 8px;
            }

            .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #ccc;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .dot.active {
                background: #d56613;
                transform: scale(1.2);
            }

            .play-pause-btn {
                background: #5b391e;
                color: white;
                border: none;
                padding: 8px 16px;
                border-radius: 20px;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .play-pause-btn:hover {
                background: #ae3319;
                transform: translateY(-1px);
                box-shadow: 0 3px 10px rgba(53, 41, 21, 0.75);
            }

            .progress-bar {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 3px;
                background: #9a8474;
                overflow: hidden;
            }

            .progress {
                height: 100%;
                background: linear-gradient(90deg, #ea8a66, #713109);
                width: 0%;
                transition: width 0.1s linear;
            }

            @media (max-width: 768px) {
                .page-container {
                    gap: 20px;
                }

                .carousel-title {
                    font-size: 2rem;
                }

                .carousel {
                    height: 400px;
                }

                .slide-content h2 {
                    font-size: 1.5rem;
                }

                .carousel-controls {
                    width: 40px;
                    height: 40px;
                    font-size: 16px;
                }

                .prev {
                    left: 5px;
                }

                .next {
                    right: 5px;
                }
            }

            @media (max-width: 580px) {
                .carousel-title {
                    font-size: 1.8rem;
                }

                .page-container {
                    gap: 15px;
                }

                .carousel {
                    height: 350px;
                }

                .slide-content {
                    padding: 12px 15px;
                    margin: 10px;
                }
            }

        <div class="page-container">
            <h1 class="carousel-title"><b>El Regalo Escondido</b></h1>
            <div class="carousel-container">
                <div class="carousel">
                    <div class="carousel-track" id="carouselTrack">
                        <div class="carousel-slide" style="background-image: url(../img/car/1.jpg)"></div>
                        <div class="carousel-slide" style="background-image: url(../img/car/2.jpg)"></div>
                        <div class="carousel-slide" style="background-image: url(../img/car/3.jpg)"></div>
                        <div class="carousel-slide" style="background-image: url(../img/car/4.jpg)"></div>
                        <div class="carousel-slide" style="background-image: url(../img/car/5.jpg)"></div>
                        <div class="carousel-slide" style="background-image: url(../img/car/6.jpg)"></div>
                    </div>
                    <button class="carousel-controls prev" onclick="prevSlide()">‹</button>
                    <button class="carousel-controls next" onclick="nextSlide()">›</button>
                </div>
                <div class="control-panel">
                    <div class="dots-container" id="dotsContainer"></div>
                    <button class="play-pause-btn" id="playPauseBtn" onclick="toggleAutoplay()">
                        <span id="playPauseIcon">⏸</span>
                        <span id="playPauseText">Pausar</span>
                    </button>
                </div>
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
            </div>

        <script>
            let currentSlide = 0;
            const totalSlides = 6;
            let isPlaying = true;
            let autoplayInterval = null;
            let progressInterval = null;
            const intervalDuration = 4000;

            const track = document.getElementById("carouselTrack");
            const dotsContainer = document.getElementById("dotsContainer");
            const progress = document.getElementById("progress");
            const playPauseIcon = document.getElementById("playPauseIcon");
            const playPauseText = document.getElementById("playPauseText");

            // Crear puntos de navegación
            function createDots() {
                for (let i = 0; i < totalSlides; i++) {
                    const dot = document.createElement("div");
                    dot.className = "dot";
                    dot.onclick = () => goToSlide(i);
                    dotsContainer.appendChild(dot);
                }
            }

            // Actualizar posición del carousel
            function updateSlidePosition() {
                const translateX = -currentSlide * 100;
                track.style.transform = `translateX(${translateX}%)`;
            }

            // Actualizar puntos activos
            function updateDots() {
                const dots = dotsContainer.querySelectorAll(".dot");
                dots.forEach((dot, index) => {
                    dot.classList.toggle("active", index === currentSlide);
                });
            }

            // Ir al siguiente slide
            function nextSlide() {
                currentSlide = (currentSlide + 1) % totalSlides;
                updateSlidePosition();
                updateDots();
                resetProgress();
            }

            // Ir al slide anterior
            function prevSlide() {
                currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
                updateSlidePosition();
                updateDots();
                resetProgress();
            }

            // Ir a un slide específico
            function goToSlide(index) {
                currentSlide = index;
                updateSlidePosition();
                updateDots();
                resetProgress();
            }

            // Iniciar autoplay
            function startAutoplay() {
                if (autoplayInterval) clearInterval(autoplayInterval);
                autoplayInterval = setInterval(nextSlide, intervalDuration);
            }

            // Detener autoplay
            function stopAutoplay() {
                if (autoplayInterval) {
                    clearInterval(autoplayInterval);
                    autoplayInterval = null;
                }
            }

            // Toggle autoplay
            function toggleAutoplay() {
                if (isPlaying) {
                    stopAutoplay();
                    stopProgressBar();
                    playPauseIcon.textContent = "▶";
                    playPauseText.textContent = "Reproducir";
                    isPlaying = false;
                } else {
                    startAutoplay();
                    startProgressBar();
                    playPauseIcon.textContent = "⏸";
                    playPauseText.textContent = "Pausar";
                    isPlaying = true;
                }
            }

            // Barra de progreso
            function startProgressBar() {
                resetProgress();
                if (progressInterval) clearInterval(progressInterval);

                let progressWidth = 0;
                const increment = 100 / (intervalDuration / 100);

                progressInterval = setInterval(() => {
                    progressWidth += increment;
                    if (progressWidth >= 100) {
                        progressWidth = 0;
                    }
                    progress.style.width = progressWidth + "%";
                }, 100);
            }

            function stopProgressBar() {
                if (progressInterval) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                }
            }

            function resetProgress() {
                progress.style.width = "0%";
                if (isPlaying) {
                    startProgressBar();
                }
            }

            // Inicializar carousel
            function initCarousel() {
                createDots();
                updateDots();
                startAutoplay();
                startProgressBar();
            }

            // Navegación con teclado
            document.addEventListener("keydown", (e) => {
                if (e.key === "ArrowRight") {
                    nextSlide();
                } else if (e.key === "ArrowLeft") {
                    prevSlide();
                } else if (e.key === " ") {
                    e.preventDefault();
                    toggleAutoplay();
                }
            });

            // Pausar en hover
            const carouselContainer = document.querySelector(".carousel-container");
            carouselContainer.addEventListener("mouseenter", () => {
                if (isPlaying) {
                    stopProgressBar();
                }
            });

            carouselContainer.addEventListener("mouseleave", () => {
                if (isPlaying) {
                    startProgressBar();
                }
            });

            // Soporte táctil
            let startX = 0;
            let endX = 0;

            carouselContainer.addEventListener("touchstart", (e) => {
                startX = e.touches[0].clientX;
            });

            carouselContainer.addEventListener("touchend", (e) => {
                endX = e.changedTouches[0].clientX;
                const threshold = 50;
                const diff = startX - endX;

                if (Math.abs(diff) > threshold) {
                    if (diff > 0) {
                        nextSlide();
                    } else {
                        prevSlide();
                    }
                }
            });

            window.addEventListener("load", initCarousel);
        </script>

        <!-- Script menú lateral -->
        <script>
            let isMenuOpen = false;
            const sideMenu = document.getElementById("sideMenu");
            const overlay = document.getElementById("overlay");

            function toggleMenu() {
                isMenuOpen = !isMenuOpen;
                if (isMenuOpen) {
                    sideMenu.classList.add("active");
                    overlay.classList.add("active");
                    document.body.style.overflow = "hidden";
                } else {
                    closeMenu();
                }
            }
            function closeMenu() {
                isMenuOpen = false;
                sideMenu.classList.remove("active");
                overlay.classList.remove("active");
                document.body.style.overflow = "";
            }
            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape" && isMenuOpen) {
                    closeMenu();
                }
            });
        </script>

                document.querySelector(".whatsapp").href = `https://api.whatsapp.com/send?text=${text}%20${pageUrl}`;
