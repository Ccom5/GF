<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lector de Libros - RESONANCIAS</title>
    <meta name="description" content="Lector de libros interactivo para las obras de Gabriel Ferré. Lee online y ajusta la experiencia de lectura a tu gusto." />
    <link rel="canonical" href="https://gf-amd.pages.dev/pages/libros/lector.html" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../../scr/styles/estilos.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <style>
        /* Fix for PDF canvas rendering */
        .reader-content canvas {
            max-width: none !important;
            margin: 0 auto;
            display: block;
        }
    </style>
</head>

<body>
    <h1 style="display: none;">Lector de Libros</h1>
    <nav class="navbar">
        <div class="navbar-content">
            <img src="../../img/logo.png" alt="Logo RESONANCIAS" width="40" height="40" />
            <div class="navbar-nav">
                <a href="../../index.html" class="nav-btn"><i class="fas fa-home"></i> Inicio</a>
                <a href="../obras.html" class="nav-btn"><i class="fas fa-book-open"></i> Obras</a>
            </div>
            <div class="navbar-toggles">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-book"></i></button>
                <button class="menu-toggle" id="controlsToggle"><i class="fas fa-cogs"></i></button>
            </div>
        </div>
    </nav>
    <div class="menu-overlay" id="menuOverlay"></div>
    <div class="main-container">
        <aside class="book-selector" id="bookSelector">
            <h2>Biblioteca</h2>
            <input type="text" id="bookSearch" class="search-input" placeholder="Buscar libro..." />
            <ul class="book-list" id="bookList"></ul>
        </aside>
        <main class="reader-panel">
            <div class="reader-nav-arrow left" id="readerPrev"><i class="fas fa-chevron-left"></i></div>
            <div class="reader-content" id="readerContent"></div>
            <div class="reader-nav-arrow right" id="readerNext"><i class="fas fa-chevron-right"></i></div>
        </main>
        <aside class="controls-panel" id="controlsPanel">
            <h2>🔧 Controles</h2>
            <div class="control-section">
                <div class="control-title">Navegación</div>
                <button class="control-btn" id="prevPage">← Anterior</button>
                <button class="control-btn" id="nextPage">Siguiente →</button>
                <p id="pageIndicator" style="text-align: center; margin-top: 0.5rem"></p>
            </div>
            <div class="control-section" id="font-controls">
                <div class="control-title">Tamaño de fuente</div>
                <div class="font-controls">
                    <button class="font-btn" onclick="changeFontSize(-10)">A-</button>
                    <span id="fontSizeDisplay">100%</span>
                    <button class="font-btn" onclick="changeFontSize(10)">A+</button>
                </div>
            </div>
            <div class="control-section" id="pdf-controls" style="display: none;">
                <div class="control-title">Zoom (PDF)</div>
                <div class="font-controls">
                    <button class="font-btn" onclick="changeZoom(-0.2)">-</button>
                    <span id="zoomDisplay">100%</span>
                    <button class="font-btn" onclick="changeZoom(0.2)">+</button>
                </div>
            </div>
            <div class="control-section" id="image-zoom-controls" style="display: none;">
                <div class="control-title">Zoom</div>
                <div class="font-controls">
                    <button class="font-btn" onclick="changeImageZoom(-0.1)">-</button>
                    <span id="imageZoomDisplay">100%</span>
                    <button class="font-btn" onclick="changeImageZoom(0.1)">+</button>
                </div>
            </div>
            <div class="control-section">
                <div class="control-title">Modo lectura</div>
                <button class="control-btn" onclick="toggleTheme()">🌙 Modo nocturno</button>
                <button class="control-btn" onclick="toggleFullscreen()">⛶ Pantalla completa</button>
            </div>
        </aside>
    </div>

    <script>
        // --- STATE MANAGEMENT ---
        let currentBookId = null;
        let chapters = [];
        let currentPage = 0;
        let totalPages = 0;
        let fontSize = 100;
        let activeMenu = null;
        let pdfDoc = null;
        let pdfPageNum = 1;
        let pdfZoom = 1.0;
        let imageZoom = 1.0;

        const books = {
            "1984 - George Orwell": { name: "1984 - George Orwell", path: "1984 - George Orwell/", type: "html" },
            "Crónicas de la Expiación": { name: "Crónicas de la Expiación", path: "Crónicas de la Expiación/", type: "html" },
            "El Aleph-J.L. Borges": { name: "El Aleph-J.L. Borges", path: "El Aleph-J.L. Borges/", type: "html" },
            "El cuervo - Edgar Allan Poe": { name: "El cuervo - Edgar Allan Poe", path: "El cuervo - Edgar Allan Poe/", type: "html" },
            "El Eternauta": { name: "El Eternauta", path: "El Eternauta/", type: "html", isImageBased: true },
            "El horror segun Lovecraft-Vol-2": { name: "El horror segun Lovecraft - Vol-2", path: "El horror segun Lovecraft - Vol-2/", type: "html" },
            "El horror segun Lovecraft-Vol-1": { name: "El horror segun Lovecraft -vol-1", path: "El horror segun Lovecraft -vol-1/", type: "html" },
            "La rebelión de las masas": { name: "La rebelión de las masas", path: "La rebelión de las masas/", type: "html" },
            "Saber no Percibido": { name: "Saber no Percibido", path: "Saber no Percibido/", type: "html" },
            "Las Venas Abiertas de América Latina": { name: "Las Venas Abiertas de América Latina", path: "las_venas_abiertas_de_amxrica_latina/", type: "html" },
        };

        // --- DOM ELEMENTS ---
        const readerContent = document.getElementById("readerContent");
        const prevBtn = document.getElementById("prevPage");
        const nextBtn = document.getElementById("nextPage");
        const pageIndicator = document.getElementById("pageIndicator");
        const fontControls = document.getElementById("font-controls");
        const pdfControls = document.getElementById("pdf-controls");
        const zoomDisplay = document.getElementById("zoomDisplay");
        const imageZoomControls = document.getElementById("image-zoom-controls");
        const imageZoomDisplay = document.getElementById("imageZoomDisplay");

        // --- INITIALIZATION ---
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("menuToggle").addEventListener("click", () => toggleMobileMenu("books"));
            document.getElementById("controlsToggle").addEventListener("click", () => toggleMobileMenu("controls"));
            document.getElementById("menuOverlay").addEventListener("click", () => closeMobileMenu());
            prevBtn.addEventListener("click", () => navigatePage(-1));
            nextBtn.addEventListener("click", () => navigatePage(1));
            document.getElementById("readerPrev").addEventListener("click", () => navigatePage(-1));
            document.getElementById("readerNext").addEventListener("click", () => navigatePage(1));
            document.getElementById("bookSearch").addEventListener("keyup", filterBooks);

            populateBookList();
            resetReaderView();

            const urlParams = new URLSearchParams(window.location.search);
            const bookToLoad = urlParams.get("book");

            if (bookToLoad && books[bookToLoad]) {
                selectBook(bookToLoad);
            }
        });

        // --- BOOK SELECTION & LOADING ---
        function populateBookList(filter = "") {
            const bookList = document.getElementById("bookList");
            bookList.innerHTML = "";
            Object.keys(books).sort().forEach(bookId => {
                const book = books[bookId];
                if (book.name.toLowerCase().includes(filter.toLowerCase())) {
                    const li = document.createElement("li");
                    li.className = "book-item";
                    li.textContent = book.name;
                    li.onclick = () => selectBook(bookId);
                    bookList.appendChild(li);
                }
            });
        }

        function filterBooks() {
            populateBookList(document.getElementById("bookSearch").value);
        }

        function selectBook(bookId) {
            currentBookId = bookId;
            document.querySelectorAll(".book-item").forEach(item => item.classList.remove("active"));
            document.querySelectorAll(".book-item").forEach(item => {
                if (item.textContent === books[bookId].name) item.classList.add("active");
            });
            if (window.innerWidth <= 1024) closeMobileMenu();
            showCover(bookId);
        }

        async function showCover(bookId) {
            const book = books[bookId];
            const coverPath = book.type === 'pdf' ? book.path.replace('.pdf', '.jpg') : `${book.path}images/cover.jpg`;
            readerContent.innerHTML = `
                <div class="cover-display">
                    <img src="${coverPath}" alt="Portada de ${book.name}" onerror="this.style.display=\'none\'">
                    <button class="control-btn" onclick="startReading()">Iniciar Lectura</button>
                </div>`;
        }

        async function startReading() {
            readerContent.innerHTML = `<div class="empty-state"><h3>Cargando libro...</h3></div>`;
            await loadFullBook();
        }

        async function loadFullBook() {
            const book = books[currentBookId];
            if (book.type === 'pdf') {
                toggleBookControls('pdf');
                await loadPdfBook(book.path);
            } else {
                toggleBookControls('html');
                await loadHtmlBook();
            }
        }

        function toggleBookControls(type) {
            const book = books[currentBookId];
            if (type === 'pdf') {
                fontControls.style.display = 'none';
                pdfControls.style.display = 'block';
                imageZoomControls.style.display = 'none';
            } else if (book && book.isImageBased) {
                fontControls.style.display = 'none';
                pdfControls.style.display = 'none';
                imageZoomControls.style.display = 'block';
            } else {
                fontControls.style.display = 'block';
                pdfControls.style.display = 'none';
                imageZoomControls.style.display = 'none';
            }
        }

        async function loadPdfBook(pdfPath) {
            readerContent.innerHTML = '<canvas id="pdf-render"></canvas>';
            try {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
                const loadingTask = pdfjsLib.getDocument(pdfPath);
                pdfDoc = await loadingTask.promise;
                totalPages = pdfDoc.numPages;
                pdfPageNum = 1;
                pdfZoom = 1.0;
                renderPdfPage(pdfPageNum);
            } catch (error) {
                console.error("Error loading PDF:", error);
                readerContent.innerHTML = `<div class="empty-state"><h3>Error al cargar el PDF</h3><p>${error.message}</p></div>`;
            }
        }

        function renderPdfPage(num) {
            pdfDoc.getPage(num).then(page => {
                const canvas = document.getElementById('pdf-render');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                const containerWidth = readerContent.clientWidth;
                
                const viewport = page.getViewport({ scale: 1.0 });
                const baseScale = containerWidth / viewport.width;
                const scale = baseScale * pdfZoom;
                
                const scaledViewport = page.getViewport({ scale: scale * dpr });

                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;

                canvas.style.width = `${scaledViewport.width / dpr}px`;
                canvas.style.height = `${scaledViewport.height / dpr}px`;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: scaledViewport
                };
                page.render(renderContext);
            });
            updatePageUI();
        }

        async function loadHtmlBook() {
            const book = books[currentBookId];
            try {
                let chapterLinks = [];

                if (book.chapters && book.chapters.length > 0) {
                    chapterLinks = book.chapters;
                } else {
                    const indexUrl = new URL(`${book.path}index.html`, window.location.href);
                    const indexResponse = await fetch(indexUrl.href);
                    if (!indexResponse.ok) throw new Error("No se pudo cargar el índice.");

                    const indexHtml = await indexResponse.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(indexHtml, "text/html");

                    chapterLinks = Array.from(doc.querySelectorAll("a[href]"))
                        .map(a => a.getAttribute("href"))
                        .filter(href => href && href.toLowerCase().startsWith("text/") && href.endsWith(".html"))
                        .filter((href, i, a) => a.indexOf(href) === i);
                }

                if (chapterLinks.length === 0) throw new Error("No se encontraron capítulos.");

                const chaptersHtml = await Promise.all(chapterLinks.map(async file => {
                    try {
                        const response = await fetch(new URL(book.path + file, window.location.href));
                        return response.ok ? await response.text() : null;
                    } catch { return null; }
                }));

                chapters = chaptersHtml.filter(html => html !== null);
                if (chapters.length === 0) throw new Error("No se pudieron cargar los capítulos.");
                displayBook();
            } catch (error) {
                readerContent.innerHTML = `<div class="empty-state"><h3>Error al cargar el libro</h3><p>${error.message}</p></div>`;
            }
        }

        function displayBook() {
            readerContent.innerHTML = "";
            chapters.forEach(chapterHtml => {
                const doc = new DOMParser().parseFromString(chapterHtml, "text/html");
                doc.querySelectorAll("img").forEach(img => {
                    const src = img.getAttribute("src");
                    if (src && !src.startsWith('http')) {
                        img.src = new URL(books[currentBookId].path + src.replace("./", ""), window.location.href).href;
                    }
                });
                const page = document.createElement("div");
                page.className = "reader-page";
                page.innerHTML = doc.body.innerHTML;
                readerContent.appendChild(page);
            });
            totalPages = chapters.length;
            currentPage = 1;
            if (books[currentBookId].isImageBased) {
                changeImageZoom(0);
            }
            navigatePage(0, true);
        }

        // --- PAGINATION & NAVIGATION ---
        function navigatePage(direction, absolute = false) {
            const book = books[currentBookId];
            if (book.type === 'pdf') {
                const newPage = pdfPageNum + direction;
                if (newPage >= 1 && newPage <= totalPages) {
                    pdfPageNum = newPage;
                    renderPdfPage(pdfPageNum);
                }
            } else {
                const newPage = absolute ? 1 : currentPage + direction;
                if (newPage >= 1 && newPage <= totalPages) {
                    currentPage = newPage;
                    readerContent.scrollTo({ left: (currentPage - 1) * readerContent.clientWidth, behavior: "smooth" });
                    updatePageUI();
                }
            }
        }

        function updatePageUI() {
            const book = books[currentBookId];
            if (!book || totalPages === 0) {
                pageIndicator.textContent = "";
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }

            const page = book.type === 'pdf' ? pdfPageNum : currentPage;
            pageIndicator.textContent = `Página ${page} de ${totalPages}`;
            if (book.type === 'pdf') {
                zoomDisplay.textContent = `${Math.round(pdfZoom * 100)}%`;
            } else if (book.isImageBased) {
                imageZoomDisplay.textContent = `${Math.round(imageZoom * 100)}%`;
            }

            const isFirst = page <= 1;
            const isLast = page >= totalPages;
            prevBtn.disabled = isFirst;
            nextBtn.disabled = isLast;
            document.getElementById("readerPrev").style.pointerEvents = isFirst ? "none" : "auto";
            document.getElementById("readerNext").style.pointerEvents = isLast ? "none" : "auto";
        }

        function resetReaderView() {
            readerContent.innerHTML = `<div class="empty-state"><h3>Selecciona un libro para comenzar</h3><p>Elige un título de la lista para iniciar la lectura</p></div>`;
            chapters = [];
            currentPage = 0;
            totalPages = 0;
            pdfDoc = null;
            pdfPageNum = 1;
            pdfZoom = 1.0;
            imageZoom = 1.0;
            toggleBookControls('html');
            updatePageUI();
        }

        // --- UI CONTROLS ---
        function changeZoom(amount) {
            if (!pdfDoc) return;
            pdfZoom = Math.max(0.2, pdfZoom + amount);
            renderPdfPage(pdfPageNum);
        }

        function changeImageZoom(amount) {
            if (!books[currentBookId] || !books[currentBookId].isImageBased) return;
            imageZoom = Math.max(0.2, imageZoom + amount);
            const images = readerContent.querySelectorAll('.reader-page img');
            images.forEach(img => {
                img.style.maxWidth = `${imageZoom * 100}%`;
                img.style.maxHeight = `${imageZoom * 100}vh`;
            });
            imageZoomDisplay.textContent = `${Math.round(imageZoom * 100)}%`;
        }

        function changeFontSize(change) {
            fontSize = Math.max(70, Math.min(150, fontSize + change));
            document.getElementById("fontSizeDisplay").textContent = `${fontSize}%`;
            readerContent.style.fontSize = `${fontSize}%`;
        }

        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function toggleMobileMenu(menuType) {
            if (activeMenu === menuType) {
                closeMobileMenu();
            } else {
                closeMobileMenu();
                activeMenu = menuType;
                document.getElementById("menuOverlay").classList.add("active");
                if (menuType === "books") {
                    document.getElementById("bookSelector").classList.add("mobile-visible");
                    document.getElementById("menuToggle").innerHTML = '<i class="fas fa-times"></i>';
                } else if (menuType === "controls") {
                    document.getElementById("controlsPanel").classList.add("mobile-visible");
                    document.getElementById("controlsToggle").innerHTML = '<i class="fas fa-times"></i>';
                }
            }
        }

        function closeMobileMenu() {
            activeMenu = null;
            document.getElementById("menuOverlay").classList.remove("active");
            document.getElementById("bookSelector").classList.remove("mobile-visible");
            document.getElementById("controlsPanel").classList.remove("mobile-visible");
            document.getElementById("menuToggle").innerHTML = '<i class="fas fa-book"></i>';
            document.getElementById("controlsToggle").innerHTML = '<i class="fas fa-cogs"></i>';
        }
    </script>
</body>

</html>
