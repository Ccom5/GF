        <!-- Script menú lateral -->
        <script>
            let isMenuOpen = false;
            const sideMenu = document.getElementById("sideMenu");
            const overlay = document.getElementById("overlay");

            function toggleMenu() {
                isMenuOpen = !isMenuOpen;
                if (isMenuOpen) {
                    sideMenu.classList.add("active");
                    overlay.classList.add("active");
                    document.body.style.overflow = "hidden";
                } else {
                    closeMenu();
                }
            }
            function closeMenu() {
                isMenuOpen = false;
                sideMenu.classList.remove("active");
                overlay.classList.remove("active");
                document.body.style.overflow = "";
            }
            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape" && isMenuOpen) {
                    closeMenu();
                }
            });
        </script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const pageUrl = encodeURIComponent(window.location.href);
                const text = encodeURIComponent("¡Mira esta nota interesante!");

                document.querySelector(".facebook").href = `https://www.facebook.com/sharer/sharer.php?u=${pageUrl}`;

                document.querySelector(".twitter").href =
                    `https://twitter.com/intent/tweet?url=${pageUrl}&text=${text}`;

                document.querySelector(".whatsapp").href = `https://api.whatsapp.com/send?text=${text}%20${pageUrl}`;

                document.querySelector(".telegram").href = `https://t.me/share/url?url=${pageUrl}&text=${text}`;
            });
