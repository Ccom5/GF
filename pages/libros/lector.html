<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Libros - RESONANCIAS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../scr/styles/estilos.css">
    
    </head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <img src="../../img/logo.png" alt="Logo RESONANCIAS" width="40" height="40">
            <div class="navbar-nav">
                <a href="../../index.html" class="nav-btn"><i class="fas fa-home"></i> Inicio</a>
                <a href="../obras.html" class="nav-btn"><i class="fas fa-book-open"></i> Obras</a>
            </div>
            <div class="navbar-toggles">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-book"></i></button>
                <button class="menu-toggle" id="controlsToggle"><i class="fas fa-cogs"></i></button>
            </div>
        </div>
    </nav>
    <div class="menu-overlay" id="menuOverlay"></div>
    <div class="main-container">
        <aside class="book-selector" id="bookSelector">
            <h2>Biblioteca</h2>
            <input type="text" id="bookSearch" class="search-input" placeholder="Buscar libro...">
            <ul class="book-list" id="bookList"></ul>
        </aside>
        <main class="reader-panel">
            <div class="reader-nav-arrow left" id="readerPrev"><i class="fas fa-chevron-left"></i></div>
            <div class="reader-content" id="readerContent"></div>
            <div class="reader-nav-arrow right" id="readerNext"><i class="fas fa-chevron-right"></i></div>
        </main>
        <aside class="controls-panel" id="controlsPanel">
            <h2>🔧 Controles</h2>
            <div class="control-section">
                <div class="control-title">Navegación</div>
                <button class="control-btn" id="prevPage">← Anterior</button>
                <button class="control-btn" id="nextPage">Siguiente →</button>
                <p id="pageIndicator" style="text-align:center; margin-top: 0.5rem;"></p>
            </div>
            <div class="control-section">
                <div class="control-title">Tamaño de fuente</div>
                <div class="font-controls">
                    <button class="font-btn" onclick="changeFontSize(-10)">A-</button>
                    <span id="fontSizeDisplay">100%</span>
                    <button class="font-btn" onclick="changeFontSize(10)">A+</button>
                </div>
            </div>
            <div class="control-section">
                <div class="control-title">Modo lectura</div>
                <button class="control-btn" onclick="toggleTheme()">🌙 Modo nocturno</button>
                <button class="control-btn" onclick="toggleFullscreen()">⛶ Pantalla completa</button>
            </div>
        </aside>
    </div>

    <script>
        // --- STATE MANAGEMENT ---
        let currentBookId = null;
        let chapters = []; // Will hold the HTML content of each chapter
        let currentPage = 0;
        let totalPages = 0;
        let fontSize = 100;
        let activeMenu = null;

        const books = {
            "1984 - George Orwell": { name: "1984 - George Orwell", path: "1984 - George Orwell/" },
            "Crónicas de la Expiación": { name: "Crónicas de la Expiación", path: "Crónicas de la Expiación/" },
            "El Aleph-J.L. Borges": { name: "El Aleph-J.L. Borges", path: "El Aleph-J.L. Borges/" },
            "El cuervo - Edgar Allan Poe": { name: "El cuervo - Edgar Allan Poe", path: "El cuervo - Edgar Allan Poe/" },
            "El Eternauta": { name: "El Eternauta", path: "El Eternauta/" },
            "El horror segun Lovecraft - Vol-2": { name: "El horror segun Lovecraft - Vol-2", path: "El horror segun Lovecraft - Vol-2/" },
            "El horror segun Lovecraft -vol-1": { name: "El horror segun Lovecraft -vol-1", path: "El horror segun Lovecraft -vol-1/" },
            "Ficciones - Jorge Luis Borges": { name: "Ficciones - Jorge Luis Borges", path: "Ficciones - Jorge Luis Borges/" },
            "La rebelión de las masas": { name: "La rebelión de las masas", path: "La rebelión de las masas/" },
            "Las venas abiertas de America L - Eduardo Galeano": { name: "Las venas abiertas de America L - Eduardo Galeano", path: "Las venas abiertas de America L - Eduardo Galeano/" },
            "Saber no Percibido": { name: "Saber no Percibido", path: "Saber no Percibido/" }
        };

        // --- DOM ELEMENTS ---
        const readerContent = document.getElementById('readerContent');
        const prevBtn = document.getElementById('prevPage');
        const nextBtn = document.getElementById('nextPage');
        const pageIndicator = document.getElementById('pageIndicator');

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('menuToggle').addEventListener('click', () => toggleMobileMenu('books'));
            document.getElementById('controlsToggle').addEventListener('click', () => toggleMobileMenu('controls'));
            document.getElementById('menuOverlay').addEventListener('click', () => closeMobileMenu());
            prevBtn.addEventListener('click', () => navigatePage(-1));
            nextBtn.addEventListener('click', () => navigatePage(1));
            document.getElementById('readerPrev').addEventListener('click', () => navigatePage(-1));
            document.getElementById('readerNext').addEventListener('click', () => navigatePage(1));
            document.getElementById('bookSearch').addEventListener('keyup', filterBooks);
            
            populateBookList();
            resetReaderView();

            const urlParams = new URLSearchParams(window.location.search);
            const bookToLoad = urlParams.get('book');
            if (bookToLoad && books[bookToLoad]) {
                selectBook(bookToLoad);
            }
        });

        // --- BOOK SELECTION & LOADING ---
        function populateBookList(filter = '') {
            const bookList = document.getElementById('bookList');
            bookList.innerHTML = '';
            const lowerCaseFilter = filter.toLowerCase();

            Object.keys(books).sort((a, b) => a.localeCompare(b)).forEach(bookId => {
                const book = books[bookId];
                if (book.name.toLowerCase().includes(lowerCaseFilter)) {
                    const listItem = document.createElement('li');
                    listItem.className = 'book-item';
                    listItem.textContent = book.name;
                    listItem.addEventListener('click', () => selectBook(bookId));
                    bookList.appendChild(listItem);
                }
            });
        }

        function filterBooks() {
            populateBookList(document.getElementById('bookSearch').value);
        }

        function selectBook(bookId) {
            currentBookId = bookId;
            document.querySelectorAll('.book-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.book-item').forEach(item => {
                if (item.textContent === books[bookId].name) item.classList.add('active');
            });
            if (window.innerWidth <= 1024) closeMobileMenu();
            showCover(bookId);
        }

        async function showCover(bookId) {
            const book = books[bookId];
            const coverPath = `${book.path}images/cover.jpg`; // Estructura estandarizada

            try {
                const fullUrl = new URL(coverPath, window.location.href);
                const response = await fetch(fullUrl.href);
                
                const contentType = response.headers.get("content-type");
                if (response.ok && contentType && contentType.startsWith("image/")) {
                    readerContent.innerHTML = `
                        <div class="cover-display">
                            <img src="${fullUrl.href}" alt="Portada de ${book.name}">
                            <button class="control-btn" onclick="startReading()">Iniciar Lectura</button>
                        </div>`;
                    console.log(`Portada encontrada en: ${coverPath}`);
                } else {
                    console.warn('No se encontró portada o no es una imagen válida para:', book.name);
                    startReading();
                }
            } catch (error) {
                console.warn('Error al cargar la portada para:', book.name, error);
                startReading();
            }
        }
        
        async function startReading() {
            readerContent.innerHTML = `<div class="empty-state"><h3>Cargando libro...</h3></div>`;
            await loadFullBook();
        }

        async function loadFullBook() {
            const book = books[currentBookId];
            try {
                const indexResponse = await fetch(`${book.path}index.html`);
                if (!indexResponse.ok) throw new Error('No se pudo cargar el índice del libro.');

                const indexHtml = await indexResponse.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(indexHtml, 'text/html');
                
                // Extraer enlaces que apunten a archivos de capítulos (.html o .xhtml)
                // Acepta archivos en cualquier estructura
                const chapterLinks = Array.from(doc.querySelectorAll('a[href]'))
                    .map(a => a.getAttribute('href'))
                    .filter(href => {
                        if (!href || href.startsWith('#') || href.startsWith('http') || href.startsWith('mailto:')) return false;
                        // Solo acepta archivos .html dentro de la carpeta 'text/'
                        return href.toLowerCase().startsWith('text/') && href.endsWith('.html');
                    })
                    .map(href => href.split('#')[0]) // Remover anclas internas
                    .filter((href, index, array) => array.indexOf(href) === index); // Remover duplicados
                
                if (chapterLinks.length === 0) {
                    console.error('No se encontraron enlaces a capítulos en el índice');
                    console.log('Contenido del índice HTML:', indexHtml.substring(0, 500));
                    throw new Error('No se encontraron capítulos en el libro.');
                }

                console.log(`Cargando ${chapterLinks.length} capítulos para "${book.name}":`, chapterLinks);

                const chapterPromises = chapterLinks.map(async (file, index) => {
                    try {
                        const response = await fetch(book.path + file);
                        if (!response.ok) {
                            console.warn(`No se pudo cargar el capítulo ${index + 1}: ${file} (HTTP ${response.status})`);
                            return null;
                        }
                        const content = await response.text();
                        console.log(`Capítulo ${index + 1} cargado: ${file}`);
                        return content;
                    } catch (error) {
                        console.warn(`Error al cargar el capítulo ${index + 1} (${file}):`, error);
                        return null;
                    }
                });
                
                const chaptersHtml = await Promise.all(chapterPromises);
                
                // Filtrar capítulos nulos y extraer contenido del body
                chapters = chaptersHtml
                    .filter(html => html !== null)
                    .map((html, index) => {
                        if (!html) return null;
                        
                        // Intentar extraer el contenido del body
                        const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
                        if (bodyMatch) {
                            return bodyMatch[1];
                        }
                        
                        // Si no hay etiqueta body, usar todo el contenido HTML
                        console.warn(`Capítulo ${index + 1} no tiene etiqueta <body>, usando contenido completo`);
                        return html;
                    })
                    .filter(chapter => chapter !== null);

                if (chapters.length === 0) {
                    throw new Error('No se pudieron cargar los capítulos del libro.');
                }

                console.log(`Se cargaron exitosamente ${chapters.length} de ${chapterLinks.length} capítulos`);
                displayBook();

            } catch (error) {
                console.error('Error al cargar el libro:', error);
                readerContent.innerHTML = `<div class="empty-state"><h3>Error al cargar el libro</h3><p>${error.message}</p><p>Revisa la consola para más detalles.</p></div>`;
            }
        }

        function displayBook() {
            readerContent.innerHTML = ''; // Clear content
            
            chapters.forEach(chapterHtml => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'reader-page';
                pageDiv.innerHTML = chapterHtml;
                readerContent.appendChild(pageDiv);
            });

            
            
            totalPages = chapters.length;
            currentPage = 1;
            navigatePage(0, true);
        }

        // --- PAGINATION & NAVIGATION ---
        function navigatePage(direction, absolute = false) {
            const newPage = absolute ? 1 : currentPage + direction;

            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                const scrollAmount = (currentPage - 1) * readerContent.clientWidth;
                readerContent.scrollTo({
                    left: scrollAmount,
                    behavior: 'smooth'
                });
                updatePageUI();
            }
        }

        function updatePageUI() {
            if (totalPages > 0) {
                pageIndicator.textContent = `Página ${currentPage} de ${totalPages}`;
            } else {
                pageIndicator.textContent = '';
            }
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
            document.getElementById('readerPrev').style.pointerEvents = currentPage <= 1 ? 'none' : 'auto';
            document.getElementById('readerNext').style.pointerEvents = currentPage >= totalPages ? 'none' : 'auto';
        }
        
        function resetReaderView() {
            readerContent.innerHTML = `<div class="empty-state">
                <h3>Selecciona un libro para comenzar</h3>
                <p>Elige un título de la lista para iniciar la lectura</p>
            </div>`;
            chapters = [];
            currentPage = 0;
            totalPages = 0;
            updatePageUI();
        }

        // --- UI CONTROLS ---
        function changeFontSize(change) {
            const newSize = fontSize + change;
            fontSize = Math.max(70, Math.min(150, newSize));
            document.getElementById('fontSizeDisplay').textContent = fontSize + '%';
            readerContent.style.fontSize = fontSize + '%';
        }

        function toggleTheme() { document.body.classList.toggle('dark-mode'); }
        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function toggleMobileMenu(menuType) {
            const bookSelector = document.getElementById('bookSelector');
            const controlsPanel = document.getElementById('controlsPanel');
            const menuToggle = document.getElementById('menuToggle');
            const controlsToggle = document.getElementById('controlsToggle');
            const menuOverlay = document.getElementById('menuOverlay');

            if (activeMenu === menuType) {
                closeMobileMenu();
            } else {
                closeMobileMenu();
                activeMenu = menuType;
                document.getElementById('menuOverlay').classList.add('active');
                if (menuType === 'books') {
                    document.getElementById('bookSelector').classList.add('mobile-visible');
                    document.getElementById('menuToggle').innerHTML = '<i class="fas fa-times"></i>';
                } else if (menuType === 'controls') {
                    document.getElementById('controlsPanel').classList.add('mobile-visible');
                    document.getElementById('controlsToggle').innerHTML = '<i class="fas fa-times"></i>';
                }
            }
        }

        function closeMobileMenu() {
            activeMenu = null;
            document.getElementById('menuOverlay').classList.remove('active');
            document.getElementById('bookSelector').classList.remove('mobile-visible');
            document.getElementById('controlsPanel').classList.remove('mobile-visible');
            document.getElementById('menuToggle').innerHTML = '<i class="fas fa-book"></i>';
            document.getElementById('controlsToggle').innerHTML = '<i class="fas fa-cogs"></i>';
        }
    </script>
</body>
</html>
